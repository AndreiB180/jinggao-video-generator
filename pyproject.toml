[project]
name = "jinggao"
version = "0.2.4"
description = "本地文稿转视频工作台"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "websocket-client>=1.8,<2",
  "qrcode>=8,<9",
  "edge-tts==7.3.1",
  "pypinyin>=0.53,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
video = ["yt-dlp[default]==2026.8.19"]
captions = ["numpy>=2.1,<3", "onnxruntime>=1.20,<2", "kaldi-native-fbank>=1.22,<2", "jieba==0.42.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jinggao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = ["B008"]
